<svg width="240" height="170" viewBox="0 0 240 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Watercolor Wash Backdrop -->
    <radialGradient id="savedPencilWash" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EBF8F4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Bookmark Emerald Wash -->
    <linearGradient id="bookmarkPencilWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <!-- Mint Tag Wash -->
    <linearGradient id="savedTagMintWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Soft Watercolor Wash Backdrop -->
  <ellipse cx="120" cy="90" rx="104" ry="66" fill="url(#savedPencilWash)" />

  <!-- Handdrawn Grounding Pencil Scribble Shadow -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M 44 144 C 74 142.5, 148 142.8, 186 144" />
    <path d="M 58 147 C 88 146, 138 146.2, 172 147" />
    <path d="M 72 150 C 98 149.2, 130 149.2, 154 150" />
    <!-- Fine 45-degree angled pencil hatch marks on base -->
    <path d="M 82 142 L 87 146 M 94 142 L 99 146 M 106 142 L 111 146 M 118 142 L 123 146 M 130 142 L 135 146" stroke-width="0.85" opacity="0.45" />
  </g>

  <!-- Handdrawn Dashed Framing (Placeholder drop zone) -->
  <path d="M 42 24 C 84 22.5, 146 22.8, 192 24.5 C 193.5 56, 193 96, 191.5 138 C 148 139.5, 86 139, 41.5 137.5 C 40 96, 40.5 56, 42 24 Z" 
        fill="none" stroke="#A7F3D0" stroke-width="1.4" stroke-dasharray="4 6" stroke-linecap="round" />

  <!-- Main Handdrawn Job Card -->
  <g transform="translate(52, 30)">
    <!-- Base Paper Wash -->
    <path d="M 5 5 C 38 3.8, 92 4.2, 126 5.5 C 127.5 35, 127 75, 125.8 105 C 92 106.2, 36 105.8, 5 105 C 3.8 75, 4.2 35, 5 5 Z" fill="#FFFFFF" />

    <!-- Primary Pencil Contour (with architectural corner overshoots) -->
    <path d="M 1 5.5 C 38 3.8, 94 4.2, 130 5.5 M 126 1 C 127.5 35, 127 75, 125.8 109 M 130 105 C 92 106.2, 34 105.8, 1 105 M 5 109 C 3.8 75, 4.2 35, 5 1" 
          fill="none" stroke="#0C463B" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Secondary sketchy pencil pass (authentic double line) -->
    <path d="M 3 3.5 C 42 4.5, 90 4, 127 5.2 M 127.5 3 C 126 36, 126.5 76, 125 106 M 127 106.5 C 88 105, 36 105.5, 3 104 M 2.5 106 C 4 74, 3.5 32, 3.5 3" 
          fill="none" stroke="#94A3B8" stroke-width="0.8" stroke-linecap="round" opacity="0.6" stroke-dasharray="60 3" />

    <!-- Sketched Briefcase Logo Tile -->
    <path d="M 14 15 C 22 14.2, 34 14.5, 38 15.2 C 39 22, 38.5 30, 37.5 36 C 30 36.8, 20 36.5, 14 36 Z" 
          fill="#EBF8F4" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
    <rect x="20" y="23" width="11" height="8" rx="1.5" fill="none" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 23 23 V 21 C 23 20, 24 19.5, 25.5 19.5 C 27 19.5, 28 20, 28 21 V 23" fill="none" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />

    <!-- Handdrawn Title and Subtitle Lines -->
    <path d="M 46 20 C 62 19.2, 78 19.5, 94 20" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 46 28 C 58 27.5, 72 27.8, 82 28" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />

    <!-- Sketched Divider Line -->
    <path d="M 14 48 C 38 47.5, 74 47.8, 116 48" stroke="#E2E8F0" stroke-width="1.3" stroke-linecap="round" />

    <!-- Handdrawn Tag Pills with Watercolor Tints -->
    <!-- Pill 1: Mint -->
    <path d="M 14 58 C 22 57.5, 36 57.8, 40 58.5 C 41 63, 40.5 67, 39.5 69 C 32 70, 20 69.5, 14 69 Z" 
          fill="url(#savedTagMintWash)" stroke="#0C463B" stroke-width="1.1" stroke-linecap="round" />
    <path d="M 19 63.5 C 24 63.3, 31 63.5, 35 63.5" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />

    <!-- Pill 2: Slate wash -->
    <path d="M 48 58 C 56 57.5, 68 57.8, 72 58.5 C 73 63, 72.5 67, 71.5 69 C 64 70, 54 69.5, 48 69 Z" 
          fill="#F1F5F9" stroke="#64748B" stroke-width="1.1" stroke-linecap="round" />
    <path d="M 53 63.5 C 58 63.3, 63 63.5, 67 63.5" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" />

    <!-- Bottom Progress/Detail Bars -->
    <path d="M 14 84 C 36 83.5, 64 83.8, 86 84" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 14 92 C 28 91.5, 48 91.8, 58 92" stroke="#E2E8F0" stroke-width="1.3" stroke-linecap="round" />

    <!-- Fine Pencil Cross-Hatch Shading on Card Right Flank -->
    <g stroke="#0C463B" stroke-width="0.75" stroke-linecap="round" opacity="0.3">
      <line x1="114" y1="26" x2="121" y2="22" />
      <line x1="115" y1="34" x2="122" y2="30" />
      <line x1="115" y1="62" x2="122" y2="58" />
      <line x1="116" y1="70" x2="123" y2="66" />
      <line x1="116" y1="78" x2="123" y2="74" />
      <line x1="117" y1="86" x2="124" y2="82" />
    </g>
  </g>

  <!-- Elegant Handdrawn Hanging Bookmark Ribbon -->
  <g transform="translate(138, 16)">
    <!-- Top ribbon fold shadow wash -->
    <path d="M 0 0 L 26 0 L 26 4 L 0 4 Z" fill="#059669" opacity="0.4" />
    
    <!-- Main Bookmark Body with classic chevron cut (Sketched fill) -->
    <path d="M 0 0 L 26 0 L 26 48 L 13 38 L 0 48 Z" fill="url(#bookmarkPencilWash)" />

    <!-- Handdrawn Bookmark Inked Outlines (Double pass) -->
    <path d="M 0 0 L 26 0 L 26 48 L 13 38 L 0 48 Z" 
          fill="none" stroke="#0C463B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 2 1 L 24 1 L 24 46 L 13 36.5 L 2 46 Z" 
          fill="none" stroke="#10B981" stroke-width="0.8" stroke-linecap="round" opacity="0.6" stroke-dasharray="28 2" />

    <!-- Handdrawn Bookmark Pin / Star Emblem -->
    <circle cx="13" cy="18" r="6" fill="#EBF8F4" stroke="#CCFBF1" stroke-width="1" />
    <!-- Sketched Star Symbol -->
    <path d="M 13 14 L 14.2 16.5 L 17 16.8 L 14.8 18.7 L 15.4 21.4 L 13 20 L 10.6 21.4 L 11.2 18.7 L 9 16.8 L 11.8 16.5 Z" 
          fill="#10B981" stroke="#0C463B" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Fine Cross-Hatch Shading Texture on Ribbon Tail -->
    <g stroke="#CCFBF1" stroke-width="0.75" stroke-linecap="round" opacity="0.35">
      <line x1="4" y1="28" x2="10" y2="24" />
      <line x1="16" y1="28" x2="22" y2="24" />
      <line x1="4" y1="34" x2="10" y2="30" />
      <line x1="16" y1="34" x2="22" y2="30" />
      <line x1="4" y1="40" x2="10" y2="36" />
      <line x1="16" y1="40" x2="22" y2="36" />
    </g>
  </g>
</svg>
