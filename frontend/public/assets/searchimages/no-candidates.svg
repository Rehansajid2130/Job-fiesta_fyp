<svg width="280" height="190" viewBox="0 0 280 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Watercolor Wash Backdrop -->
    <radialGradient id="candPencilWash" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EBF8F4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Ink Accent Tint -->
    <linearGradient id="emeraldInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="primaryInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <linearGradient id="mintBadgeWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Soft Watercolor Wash Backdrop -->
  <ellipse cx="140" cy="100" rx="120" ry="72" fill="url(#candPencilWash)" />

  <!-- Grounding Pencil Scribble Shadow -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M 54 162 C 96 160.5, 184 160.5, 226 162" />
    <path d="M 72 165 C 108 164, 172 164.2, 208 165" />
    <path d="M 94 168 C 120 167.2, 160 167.2, 186 168" />
    <!-- Fine 45-degree ground hatch marks -->
    <path d="M 98 160 L 104 165 M 112 160 L 118 165 M 126 160 L 132 165 M 140 160 L 146 165 M 154 160 L 160 165 M 168 160 L 174 165 M 182 160 L 188 165" stroke-width="0.85" opacity="0.45" />
  </g>

  <!-- Background Folder Flap (Angled & Sketched) -->
  <g transform="translate(62, 38) rotate(-5)">
    <!-- Folder Backing Plate -->
    <path d="M 4 20 L 36 20 L 44 12 L 126 12 L 128 116 L 4 116 Z" fill="#E2E8F0" opacity="0.4" />
    <path d="M 0 20 C 32 19.5, 34 19.8, 38 20 L 44 12 C 48 11.5, 120 11.8, 130 12 M 126 8 C 128 42, 127 84, 128 120 M 132 116 C 96 117, 36 116.5, 0 116 M 4 120 C 3 84, 3.5 44, 4 16"
          stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Main Candidate Profile Card / Dossier Sheet -->
  <g transform="translate(74, 36)">
    <!-- Base Paper Wash -->
    <path d="M 4 4 C 36 3, 94 3.5, 124 4.5 C 125.5 36, 125 82, 123.5 118 C 92 119.2, 36 118.8, 4 118 C 2.5 82, 3 36, 4 4 Z" fill="#FFFFFF" />

    <!-- Primary Ink Contour with corner overshoots -->
    <path d="M 0 4.5 C 36 3, 96 3.5, 128 4.5 M 124 0 C 125.5 36, 125 82, 123.5 122 M 128 118 C 92 119.2, 32 118.8, 0 118 M 4 122 C 2.5 82, 3 36, 4 0"
          stroke="#0C463B" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Secondary loose pencil pass -->
    <path d="M 2 3 C 38 4.2, 92 3.8, 126 3 M 125.5 2 C 124 38, 124.5 80, 125 119 M 126 119 C 94 117.8, 36 118.2, 2 119 M 2.5 119 C 3.5 80, 2.5 38, 2.5 2"
          stroke="#64748B" stroke-width="0.8" stroke-linecap="round" opacity="0.5" />

    <!-- Top ID Header Wash -->
    <path d="M 4 5 L 124 5.5 L 123.8 30 L 4 29.5 Z" fill="#EBF8F4" />
    <path d="M 2 30 C 38 29.5, 90 29.8, 126 30" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />

    <!-- Handdrawn Candidate Avatar Frame -->
    <g transform="translate(14, 40)">
      <!-- Avatar Circle Contour -->
      <circle cx="16" cy="16" r="14" fill="#F1F5F9" />
      <circle cx="16" cy="16" r="14" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="16" cy="16" r="15" stroke="#10B981" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.6" />
      
      <!-- Sketched Head and Shoulders Profile -->
      <circle cx="16" cy="12" r="4.5" fill="#10B981" fill-opacity="0.8" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 8 26 C 9 20, 13 18.5, 16 18.5 C 19 18.5, 23 20, 24 26" 
            fill="#D1FAE5" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Candidate Name & Details Text Lines -->
    <g transform="translate(54, 42)">
      <!-- Name Bar -->
      <path d="M 0 5 C 16 4.6, 42 4.8, 56 5" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 2 5.5 C 18 5.2, 40 5.4, 54 5.5" stroke="#10B981" stroke-width="1" stroke-linecap="round" opacity="0.6" />
      
      <!-- Role / Specialty line -->
      <path d="M 0 14 C 14 13.6, 32 13.8, 44 14" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />

      <!-- Skill Tag Chips (Handdrawn Wash) -->
      <rect x="0" y="21" width="22" height="7" rx="3.5" fill="url(#mintBadgeWash)" />
      <rect x="0" y="21" width="22" height="7" rx="3.5" stroke="#0C463B" stroke-width="0.85" />
      <rect x="26" y="21" width="26" height="7" rx="3.5" fill="#EFF6FF" />
      <rect x="26" y="21" width="26" height="7" rx="3.5" stroke="#3B82F6" stroke-width="0.85" opacity="0.7" />
    </g>

    <!-- Profile Document Body Fill Scribble Lines -->
    <g transform="translate(14, 82)">
      <path d="M 0 0 C 26 -0.5, 68 -0.2, 98 0" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" />
      <path d="M 0 9 C 22 8.6, 54 8.8, 86 9" stroke="#E2E8F0" stroke-width="1.3" stroke-linecap="round" />
      <path d="M 0 18 C 30 17.5, 72 17.8, 92 18" stroke="#E2E8F0" stroke-width="1.3" stroke-linecap="round" />
      <path d="M 0 27 C 18 26.6, 46 26.8, 62 27" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
    </g>
    
    <!-- Subtle Pencil Hatching on Document Corner -->
    <g stroke="#94A3B8" stroke-width="0.75" opacity="0.4">
      <path d="M 104 98 L 116 110 M 108 98 L 118 108 M 112 98 L 120 106" />
    </g>
  </g>

  <!-- Foreground Handdrawn Magnifying Glass Inspecting Pipeline -->
  <g transform="translate(172, 72) rotate(16)">
    <!-- Lens Drop Shadow Wash -->
    <ellipse cx="26" cy="26" rx="25" ry="25" fill="#EBF8F4" opacity="0.85" />

    <!-- Glass Rim Wash -->
    <circle cx="25" cy="25" r="23" fill="#FFFFFF" fill-opacity="0.85" />
    
    <!-- Primary Outer Rim Ink Contour -->
    <circle cx="25" cy="25" r="23" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" />
    <!-- Secondary Offset Sketch Rim -->
    <circle cx="26" cy="24" r="22.5" stroke="#10B981" stroke-width="1" opacity="0.7" />

    <!-- Inner Glass Glare Highlight Arcs -->
    <path d="M 12 15 A 16 16 0 0 1 34 11" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" />
    <path d="M 14 36 A 16 16 0 0 0 32 39" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" />

    <!-- Center Lens Sparkle (Search / Discovery Motif) -->
    <g transform="translate(25, 25)">
      <path d="M 0 -7 L 0 7 M -7 0 L 7 0" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="0" cy="0" r="1.5" fill="#10B981" />
    </g>

    <!-- Handle Connector Ring -->
    <path d="M 41 41 L 46 46" stroke="#0C463B" stroke-width="3" stroke-linecap="round" />

    <!-- Handdrawn Pencil Textured Handle -->
    <path d="M 45 45 C 50 49, 72 70, 75 74 C 77 76, 75 79, 72 79 C 69 79, 48 57, 44 52 Z"
          fill="url(#primaryInk)" stroke="#0C463B" stroke-width="1.8" stroke-linejoin="round" />
    
    <!-- Handle Grip Lines -->
    <path d="M 54 57 L 57 54 M 60 63 L 63 60 M 66 69 L 69 66" stroke="#A7F3D0" stroke-width="1.1" stroke-linecap="round" />
  </g>

  <!-- Handdrawn Whimsical Accents & Sparkles -->
  <!-- Top Left Sparkle -->
  <g transform="translate(52, 28)">
    <path d="M 0 -6 L 0 6 M -6 0 L 6 0" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="1" fill="#0C463B" />
  </g>
  <!-- Top Right Sparkle -->
  <g transform="translate(228, 44)">
    <path d="M 0 -5 L 0 5 M -5 0 L 5 0" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <!-- Little Floating Scribble Dots / Stars -->
  <circle cx="48" cy="74" r="1.8" fill="#10B981" opacity="0.75" />
  <circle cx="236" cy="138" r="1.6" fill="#94A3B8" opacity="0.6" />
  <circle cx="58" cy="134" r="1.4" fill="#0C463B" opacity="0.5" />
</svg>
