<svg width="260" height="180" viewBox="0 0 260 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Calm Ambient Backdrop -->
    <radialGradient id="appliedMintGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#EBF8F4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Clean Linear Gradients -->
    <linearGradient id="emeraldBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="appliedShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0C463B" flood-opacity="0.08"/>
    </filter>

    <filter id="badgeShadow" x="-15%" y="-15%" width="135%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#08342C" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <ellipse cx="130" cy="95" rx="110" ry="70" fill="url(#appliedMintGlow)" />

  <!-- Background Layered Document (Soft Slate) -->
  <g transform="translate(74, 38) rotate(-6)">
    <rect width="90" height="110" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="20" width="50" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="14" y="32" width="35" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="14" y="42" width="45" height="4" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Main Application Document Card -->
  <g transform="translate(85, 30)" filter="url(#appliedShadow)">
    <rect width="96" height="118" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Top Emerald Header Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 86 0 Q 96 0 96 10 L 96 18 L 0 18 Z" fill="url(#emeraldBadge)"/>
    <circle cx="16" cy="9" r="3" fill="#10B981"/>
    <rect x="26" y="7" width="44" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>

    <!-- Document Info Lines -->
    <rect x="14" y="30" width="56" height="6" rx="3" fill="#0C463B" fill-opacity="0.8"/>
    <rect x="14" y="42" width="40" height="4" rx="2" fill="#94A3B8"/>
    
    <!-- Divider -->
    <line x1="14" y1="54" x2="82" y2="54" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Skills / Tag Placeholders -->
    <rect x="14" y="62" width="28" height="12" rx="6" fill="#EBF8F4"/>
    <rect x="18" y="66" width="20" height="4" rx="2" fill="#0C463B" fill-opacity="0.6"/>

    <rect x="46" y="62" width="30" height="12" rx="6" fill="#F1F5F9"/>
    <rect x="50" y="66" width="22" height="4" rx="2" fill="#64748B"/>

    <rect x="14" y="80" width="68" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="14" y="88" width="50" height="4" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Big Official "Application On File" Badge Overlay -->
  <g transform="translate(68, 108)" filter="url(#badgeShadow)">
    <!-- Badge Background Pill -->
    <rect width="132" height="34" rx="17" fill="#0C463B" stroke="#10B981" stroke-width="1.5"/>
    
    <!-- Checkmark Circle Accent -->
    <circle cx="18" cy="17" r="11" fill="#10B981"/>
    <path d="M 13 17 L 16.5 20.5 L 23 13.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Text Label -->
    <text x="36" y="21" fill="#FFFFFF" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="0.3">
      ALREADY APPLIED
    </text>
  </g>

  <!-- Small Status Clock (Under Review Indicator - Top Right) -->
  <g transform="translate(182, 38)" filter="url(#appliedShadow)">
    <circle cx="14" cy="14" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="11" fill="#ECFDF5"/>
    <!-- Clock Hands -->
    <circle cx="14" cy="14" r="2" fill="#0C463B"/>
    <path d="M 14 8 V 14 L 18 16" stroke="#0C463B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Minimal Decorative Accents -->
  <circle cx="48" cy="65" r="3" fill="#10B981" fill-opacity="0.8"/>
  <circle cx="218" cy="100" r="3" fill="#CBD5E1"/>
  <circle cx="58" cy="142" r="2" fill="#A7F3D0"/>
</svg>
