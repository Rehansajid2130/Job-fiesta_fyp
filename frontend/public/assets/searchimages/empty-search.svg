<svg width="320" height="220" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Background Gradients -->
    <radialGradient id="mintGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#EBF8F4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="folderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="primaryEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <linearGradient id="accentMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="glassReflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#EBF8F4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0C463B" flood-opacity="0.08"/>
    </filter>

    <filter id="lensShadow" x="-20%" y="-20%" width="145%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="160" cy="115" rx="140" ry="85" fill="url(#mintGlow)" />
  <circle cx="255" cy="50" r="16" fill="#ECFDF5" />
  <circle cx="65" cy="150" r="22" fill="#EBF8F4" />

  <!-- Background Decorative Orbit Lines -->
  <path d="M 40 120 C 70 70, 240 60, 280 110" stroke="#CCFBF1" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
  <path d="M 50 145 C 90 190, 220 185, 270 140" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round"/>

  <!-- Left Floating Badge (Resume / Document) -->
  <g transform="translate(62, 58) rotate(-7)" filter="url(#softShadow)">
    <rect width="72" height="96" rx="8" fill="url(#folderGradient)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Header stripe -->
    <path d="M 0 8 Q 0 0 8 0 L 64 0 Q 72 0 72 8 L 72 20 L 0 20 Z" fill="#0C463B" />
    <circle cx="14" cy="10" r="3" fill="#10B981" />
    <rect x="23" y="8" width="34" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
    <!-- Document lines -->
    <rect x="12" y="32" width="48" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="12" y="44" width="38" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="12" y="54" width="44" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="12" y="64" width="30" height="4" rx="2" fill="#E2E8F0"/>
    <!-- Mini Stamp Check -->
    <circle cx="52" cy="78" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
    <path d="M49 78 L51.5 80.5 L56 75.5" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Primary Card (Job Listing / Search Target) -->
  <g transform="translate(108, 42)" filter="url(#softShadow)">
    <rect width="130" height="126" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Job Header Block -->
    <rect x="12" y="14" width="30" height="30" rx="8" fill="#EBF8F4" stroke="#A7F3D0" stroke-width="1"/>
    <!-- Briefcase icon inside header -->
    <path d="M21 24 H33 V34 H21 Z" fill="#0C463B" fill-opacity="0.15"/>
    <rect x="22" y="24" width="10" height="8" rx="1.5" fill="none" stroke="#0C463B" stroke-width="1.5"/>
    <path d="M25 24 V22 Q 25 21 26 21 H 28 Q 29 21 29 22 V 24" fill="none" stroke="#0C463B" stroke-width="1.5"/>

    <!-- Job Title Placeholder Bars -->
    <rect x="50" y="18" width="66" height="8" rx="4" fill="#0C463B" />
    <rect x="50" y="32" width="44" height="6" rx="3" fill="#94A3B8" />

    <!-- Divider -->
    <line x1="12" y1="56" x2="118" y2="56" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Job Tags & Details -->
    <rect x="12" y="66" width="34" height="14" rx="7" fill="#EBF8F4"/>
    <rect x="18" y="70" width="22" height="5" rx="2.5" fill="#0C463B" fill-opacity="0.7"/>

    <rect x="52" y="66" width="32" height="14" rx="7" fill="#F1F5F9"/>
    <rect x="58" y="70" width="20" height="5" rx="2.5" fill="#64748B"/>

    <rect x="90" y="66" width="28" height="14" rx="7" fill="#F1F5F9"/>
    <rect x="96" y="70" width="16" height="5" rx="2.5" fill="#64748B"/>

    <!-- Progress / Location placeholder bar -->
    <rect x="12" y="94" width="106" height="6" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="12" y="94" width="46" height="6" rx="3" fill="#10B981"/>
    
    <rect x="12" y="108" width="60" height="5" rx="2.5" fill="#CBD5E1"/>
  </g>

  <!-- Big Stylized Magnifying Glass with Modern Glass Lens -->
  <g transform="translate(162, 70)" filter="url(#lensShadow)">
    <!-- Lens Rim Outer -->
    <circle cx="52" cy="52" r="42" fill="#FFFFFF" fill-opacity="0.2" stroke="#0C463B" stroke-width="6"/>
    <!-- Inner Lens Reflection -->
    <circle cx="52" cy="52" r="39" fill="url(#glassReflection)"/>

    <!-- Compass / Focus Reticle inside lens -->
    <circle cx="52" cy="52" r="22" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="3 4"/>
    <circle cx="52" cy="52" r="5" fill="#0C463B"/>
    <circle cx="52" cy="52" r="2" fill="#FFFFFF"/>
    <line x1="52" y1="24" x2="52" y2="30" stroke="#0C463B" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="74" x2="52" y2="80" stroke="#0C463B" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="52" x2="30" y2="52" stroke="#0C463B" stroke-width="2" stroke-linecap="round"/>
    <line x1="74" y1="52" x2="80" y2="52" stroke="#0C463B" stroke-width="2" stroke-linecap="round"/>

    <!-- Glass Specular Highlight Arc -->
    <path d="M 28 36 A 34 34 0 0 1 70 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Handle Connector -->
    <path d="M 82 82 L 89 89" stroke="#10B981" stroke-width="9" stroke-linecap="round"/>
    <!-- Ergonomic Handle -->
    <path d="M 87 87 L 118 118" stroke="url(#primaryEmerald)" stroke-width="12" stroke-linecap="round"/>
    <!-- Handle Accent Tip -->
    <circle cx="118" cy="118" r="6" fill="#08342C"/>
    <circle cx="118" cy="118" r="2.5" fill="#2DD4BF"/>
  </g>

  <!-- Sparkles & Floating Delight Elements -->
  <!-- Emerald Star 1 (Top Left) -->
  <g transform="translate(100, 32)">
    <path d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7 Z" fill="#10B981"/>
  </g>

  <!-- Emerald Star 2 (Top Right) -->
  <g transform="translate(262, 75) scale(0.85)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#0C463B"/>
  </g>

  <!-- Emerald Star 3 (Bottom Left) -->
  <g transform="translate(74, 168) scale(0.7)">
    <path d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7 Z" fill="#10B981"/>
  </g>

  <!-- Floating Circles / Accent Rings -->
  <circle cx="282" cy="132" r="5" fill="#A7F3D0" />
  <circle cx="56" cy="98" r="3.5" fill="#34D399" />
  <circle cx="242" cy="168" r="4" fill="#CBD5E1" />
  <circle cx="145" cy="22" r="3" fill="#0C463B" fill-opacity="0.4" />
</svg>
