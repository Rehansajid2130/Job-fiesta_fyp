<svg width="240" height="170" viewBox="0 0 240 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Watercolor Wash Backdrop -->
    <radialGradient id="appPencilWash" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EBF8F4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Pencil Emerald Tint -->
    <linearGradient id="clipPencilTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <!-- Plane Wing Watercolor Tint -->
    <linearGradient id="planeAppBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <linearGradient id="planeAppWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Ambient Soft Watercolor Wash Backdrop -->
  <ellipse cx="120" cy="90" rx="104" ry="66" fill="url(#appPencilWash)" />

  <!-- Handdrawn Grounding Pencil Scribble Shadow -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M 48 146 C 76 144.5, 142 144.8, 178 146" />
    <path d="M 60 149 C 86 148, 132 148.2, 164 149" />
    <path d="M 74 152 C 96 151.2, 122 151.2, 146 152" />
    <!-- Fine 45-degree angled pencil hatch marks on base -->
    <path d="M 80 144 L 85 148 M 92 144 L 97 148 M 104 144 L 109 148 M 116 144 L 121 148 M 128 144 L 133 148" stroke-width="0.85" opacity="0.45" />
  </g>

  <!-- Handdrawn Clipboard / Folder Backing Plate -->
  <g>
    <!-- Clipboard Base Wash -->
    <path d="M 60 26 C 90 24.5, 142 24.8, 168 26.5 C 169.5 58, 169 110, 167.5 142 C 140 143.2, 88 142.8, 59.5 141.5 C 58 110, 58.5 58, 60 26 Z" 
          fill="#EBF8F4" />

    <!-- Sketched Clipboard Outlines with Corner Overshoots -->
    <path d="M 56 26.5 C 88 25, 144 25.2, 172 26.5 M 168 22 C 169.5 58, 169 110, 167.5 146 M 172 142 C 140 143.2, 86 142.8, 56 141.5 M 60 146 C 58 110, 58.5 58, 60 22" 
          fill="none" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Main Handdrawn Application / Resume Document Sheet -->
  <g transform="translate(70, 32)">
    <!-- Base Paper Wash -->
    <path d="M 4 4 C 30 3, 68 3.5, 92 4.5 C 93.5 32, 93 76, 91.8 110 C 66 111.2, 28 110.8, 4 110 C 2.8 76, 3.2 32, 4 4 Z" fill="#FFFFFF" />

    <!-- Primary Pencil Contour (with corner overshoots) -->
    <path d="M 0 4.5 C 30 3, 70 3.5, 96 4.5 M 92 0 C 93.5 32, 93 76, 91.8 114 M 96 110 C 66 111.2, 26 110.8, 0 110 M 4 114 C 2.8 76, 3.2 32, 4 0" 
          fill="none" stroke="#0C463B" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Secondary loose sketchy pencil pass (authentic double line) -->
    <path d="M 2.5 3 C 32 4, 66 3.8, 93 4.8 M 93.5 2 C 92 34, 92.5 78, 91 111 M 93 111.5 C 64 110, 28 110.5, 2 109 M 2 111 C 3.5 78, 3 30, 3 2" 
          fill="none" stroke="#94A3B8" stroke-width="0.8" stroke-linecap="round" opacity="0.6" stroke-dasharray="50 3" />

    <!-- Sketched Profile Avatar & Header -->
    <circle cx="18" cy="20" r="7.5" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="18" cy="18" r="2.5" fill="#0C463B" />
    <path d="M 13.5 24 C 13.5 21.5, 15.5 21.2, 18 21.2 C 20.5 21.2, 22.5 21.5, 22.5 24" 
          fill="none" stroke="#0C463B" stroke-width="1.1" stroke-linecap="round" />

    <!-- Handdrawn Applicant Title and Subtitle Lines -->
    <path d="M 30 17 C 48 16.2, 64 16.5, 78 17" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 30 25 C 44 24.5, 54 24.8, 62 25" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />

    <!-- Sketched Divider Line -->
    <path d="M 10 35 C 34 34.5, 62 34.8, 86 35" stroke="#E2E8F0" stroke-width="1.3" stroke-linecap="round" />

    <!-- Handdrawn Experience & Skills Section Lines -->
    <path d="M 10 44 C 20 43.5, 30 43.8, 38 44" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 10 52 C 34 51.5, 62 51.8, 84 52" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 10 60 C 26 59.5, 48 59.8, 68 60" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round" />

    <path d="M 10 71 C 18 70.5, 26 70.8, 34 71" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 10 79 C 34 78.5, 62 78.8, 84 79" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 10 87 C 24 86.5, 42 86.8, 56 87" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round" />

    <!-- Bottom Readiness Indicator Bar (Handdrawn) -->
    <path d="M 10 99 C 34 98.5, 62 98.8, 84 99" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 10 99 C 20 98.6, 32 98.8, 42 99" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />

    <!-- Fine Pencil Cross-Hatch Shading on Document Right Flank -->
    <g stroke="#0C463B" stroke-width="0.75" stroke-linecap="round" opacity="0.3">
      <line x1="82" y1="24" x2="88" y2="20" />
      <line x1="82" y1="32" x2="88" y2="28" />
      <line x1="83" y1="58" x2="89" y2="54" />
      <line x1="83" y1="66" x2="89" y2="62" />
      <line x1="84" y1="84" x2="90" y2="80" />
      <line x1="84" y1="92" x2="90" y2="88" />
    </g>
  </g>

  <!-- Handdrawn Clipboard Metallic Clip & Grip at Top -->
  <g transform="translate(102, 20)">
    <!-- Clip Loop -->
    <path d="M 8 7 C 8 2, 12 0, 18 0 C 24 0, 28 2, 28 7" 
          fill="none" stroke="#0C463B" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 9.5 6.5 C 9.5 3, 12.5 1.5, 18 1.5 C 23.5 1.5, 26.5 3, 26.5 6.5" 
          fill="none" stroke="#10B981" stroke-width="0.9" stroke-linecap="round" />

    <!-- Clip Bar -->
    <rect x="0" y="6" width="36" height="10" rx="3" fill="url(#clipPencilTint)" stroke="#0C463B" stroke-width="1.4" />
    <circle cx="18" cy="11" r="2" fill="#EBF8F4" />
  </g>

  <!-- Handdrawn Ascending Paper Airplane with Dashed Trajectory -->
  <!-- Flight Path Dashed Curve -->
  <path d="M 148 118 C 160 112, 172 96, 178 80" 
        fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.8" />

  <g transform="translate(166, 58) rotate(-8)">
    <!-- Lower wing shade -->
    <path d="M 2 17 L 26 1 L 10 18 Z" fill="#065F46" fill-opacity="0.35" />

    <!-- Main Emerald Fuselage -->
    <path d="M 0 16 L 26 0 L 14 26 L 10 17 Z" fill="url(#planeAppBody)" />

    <!-- Folded Top Wing Highlight -->
    <path d="M 0 16 L 26 0 L 10 17 Z" fill="url(#planeAppWing)" />

    <!-- Authentic Handdrawn Ink Outlines -->
    <path d="M 0 16 L 26 0 L 14 26 L 10 17 Z" 
          fill="none" stroke="#0C463B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="0" y1="16" x2="26" y2="0" stroke="#CCFBF1" stroke-width="0.9" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
