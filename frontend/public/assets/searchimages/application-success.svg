<svg width="260" height="180" viewBox="0 0 260 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Watercolor Wash Backdrop -->
    <radialGradient id="successPencilWash" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EBF8F4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Plane Wing Watercolor Tint -->
    <linearGradient id="planePencilBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <linearGradient id="planePencilWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="stampPencilTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Soft Watercolor Wash Backdrop -->
  <ellipse cx="130" cy="95" rx="112" ry="72" fill="url(#successPencilWash)" />

  <!-- Grounding Pencil Scribble Shadow Beneath Envelope -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M 44 146 C 72 144.5, 126 144.8, 148 146" />
    <path d="M 54 149 C 78 148, 116 148.2, 138 149" />
    <path d="M 68 152 C 86 151.2, 108 151.2, 126 152" />
    <!-- Fine 45-degree angled pencil hatch marks on ground -->
    <path d="M 74 144 L 79 148 M 86 144 L 91 148 M 98 144 L 103 148 M 110 144 L 115 148" stroke-width="0.85" opacity="0.45" />
  </g>

  <!-- Handdrawn Flight Path Curve (Dashed pencil trajectory) -->
  <path d="M 78 118 C 96 92, 132 72, 168 56" 
        fill="none" stroke="#10B981" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.8" />
  <path d="M 80 119 C 98 94, 134 74, 169 58" 
        fill="none" stroke="#0C463B" stroke-width="0.75" stroke-dasharray="5 7" stroke-linecap="round" opacity="0.4" />

  <!-- Handdrawn Application Envelope / Folder -->
  <g transform="translate(52, 74) rotate(-5)">
    <!-- Base Paper Wash -->
    <path d="M 5 5 C 28 3.8, 64 4.2, 85 5.5 C 86.5 24, 86 48, 84.8 62 C 64 63.2, 26 62.8, 4 62 C 3.2 46, 3.8 24, 5 5 Z" fill="#FFFFFF" />

    <!-- Primary Pencil Contour (with architectural corner overshoots) -->
    <path d="M 1 5.5 C 28 3.8, 66 4.2, 89 5.5 M 85 1 C 86.5 24, 86 48, 84.8 66 M 89 62 C 64 63.2, 24 62.8, 0 62 M 4 66 C 3.2 46, 3.8 24, 4 1" 
          fill="none" stroke="#0C463B" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Secondary loose sketchy pencil pass (authentic double line) -->
    <path d="M 3 3.5 C 32 4.5, 62 4, 86 5.2 M 86.5 3 C 85 26, 85.5 50, 84 63 M 86 63.5 C 60 62, 26 62.5, 3 61 M 2.5 63 C 4 44, 3.5 22, 3.5 3" 
          fill="none" stroke="#94A3B8" stroke-width="0.8" stroke-linecap="round" opacity="0.6" stroke-dasharray="45 3" />

    <!-- Envelope Flap / Top Stripe Wash -->
    <path d="M 5 5 L 85 5 L 84.5 16 L 4.5 16 Z" fill="#EBF8F4" />
    <path d="M 2 16 C 26 15.2, 58 15.5, 87 16" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />

    <!-- Handdrawn Content Lines -->
    <path d="M 14 26 C 28 25.5, 46 25.8, 54 26" stroke="#0C463B" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 14 34 C 24 33.6, 38 33.8, 46 34" stroke="#CBD5E1" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 14 42 C 26 41.6, 42 41.8, 50 42" stroke="#E2E8F0" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 14 50 C 22 49.6, 32 49.8, 38 50" stroke="#E2E8F0" stroke-width="1.3" stroke-linecap="round" />

    <!-- Fine Pencil Cross-Hatch Shading on Envelope Left Flank -->
    <g stroke="#0C463B" stroke-width="0.75" stroke-linecap="round" opacity="0.28">
      <line x1="12" y1="56" x2="18" y2="52" />
      <line x1="18" y1="56" x2="24" y2="52" />
      <line x1="24" y1="56" x2="30" y2="52" />
    </g>

    <!-- Handdrawn Stamp Badge (Approved / Applied Check) -->
    <g>
      <!-- Stamp shadow backing -->
      <circle cx="66" cy="40" r="12" fill="#FFFFFF" />

      <!-- Sketched circular stamp contour (double loop) -->
      <path d="M 66 28 C 72.5 28, 78 33.5, 78 40 C 78 46.5, 72.5 52, 66 52 C 59.5 52, 54 46.5, 54 40 C 54 33.5, 59.5 28, 66 28 Z" 
            fill="url(#stampPencilTint)" stroke="#0C463B" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 65 29.5 C 71 29, 76.5 34, 76.5 40 C 76.5 46, 71.5 50.5, 65.5 50.8 C 59.5 50.5, 55 46, 55 40 C 55 34, 59.5 29.5, 65 29.5" 
            fill="none" stroke="#10B981" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="24 2" />

      <!-- Confident Handdrawn Checkmark -->
      <path d="M 61 40 C 62.5 41.5, 63.2 42.2, 64 43.5 C 65.5 40.5, 68 37, 71 34.5" 
            fill="none" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 61.8 39.5 C 63 41, 63.6 42, 64.2 43 C 65.8 40, 68 37, 70.5 35" 
            fill="none" stroke="#065F46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Big Handdrawn Paper Airplane (Taking Off in Flight) -->
  <g transform="translate(142, 28) rotate(8)">
    <!-- Lower Wing Fold Shade (Semi-transparent emerald wash) -->
    <path d="M 22 66 L 76 32 L 20 38 Z" fill="#065F46" fill-opacity="0.35" />

    <!-- Main Emerald Fuselage & Wings (Sketched fill) -->
    <path d="M 4 38 L 76 12 L 26 58 Z" fill="url(#planePencilBody)" />

    <!-- Center Fold Crease -->
    <path d="M 4 38 L 76 12 L 26 40 Z" fill="#08342C" />

    <!-- Top Wing Highlight Fold (Mint watercolor wash) -->
    <path d="M 26 40 L 76 12 L 58 50 Z" fill="url(#planePencilWing)" />

    <!-- Authentic Handdrawn Ink Outlines for the Paper Airplane -->
    <!-- Outer boundary contour -->
    <path d="M 4 38 L 76 12 L 26 58 Z" 
          fill="none" stroke="#0C463B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Wing fold ridge line -->
    <path d="M 4 38 L 76 12" stroke="#CCFBF1" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 26 40 L 76 12" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 22 66 L 76 32" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />

    <!-- Secondary loose sketchy pass along wing tips -->
    <path d="M 2 37.5 L 78 11.5" stroke="#0C463B" stroke-width="0.8" stroke-linecap="round" opacity="0.5" />
    <path d="M 76 12 L 26 59" stroke="#10B981" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />

    <!-- Fine Cross-Hatch Shading Texture on Lower Fuselage -->
    <g stroke="#CCFBF1" stroke-width="0.75" stroke-linecap="round" opacity="0.4">
      <line x1="28" y1="44" x2="34" y2="40" />
      <line x1="34" y1="46" x2="40" y2="42" />
      <line x1="40" y1="48" x2="46" y2="44" />
      <line x1="46" y1="50" x2="52" y2="46" />
    </g>
  </g>
</svg>
