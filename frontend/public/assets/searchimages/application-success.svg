<svg width="260" height="180" viewBox="0 0 260 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Calm Ambient Backdrop -->
    <radialGradient id="calmMintGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#EBF8F4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Clean Emerald Gradient -->
    <linearGradient id="emeraldBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="cleanShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0C463B" flood-opacity="0.08"/>
    </filter>

    <filter id="planeCleanShadow" x="-15%" y="-15%" width="135%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="130" cy="95" rx="110" ry="70" fill="url(#calmMintGlow)" />

  <!-- Smooth Minimal Arc Flight Path -->
  <path d="M 65 130 C 85 95, 120 70, 160 55" stroke="#10B981" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- Minimal Application Card / Document Base -->
  <g transform="translate(50, 72) rotate(-5)" filter="url(#cleanShadow)">
    <rect width="84" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Green Stripe Accent -->
    <path d="M 0 6 Q 0 0 6 0 L 78 0 Q 84 0 84 6 L 84 10 L 0 10 Z" fill="#0C463B"/>
    
    <!-- Document placeholder lines -->
    <rect x="12" y="20" width="42" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="12" y="28" width="30" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="12" y="35" width="36" height="3" rx="1.5" fill="#E2E8F0"/>

    <!-- Subtle Verified Green Check Badge -->
    <circle cx="62" cy="38" r="11" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 57 38 L 60.5 41.5 L 67 34.5" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sleek Minimalist Paper Airplane -->
  <g transform="translate(136, 26) rotate(10)" filter="url(#planeCleanShadow)">
    <!-- Bottom Wing Fold -->
    <path d="M 28 65 L 75 35 L 25 40 Z" fill="#059669" opacity="0.4"/>

    <!-- Main Emerald Body -->
    <path d="M 5 40 L 75 15 L 30 58 Z" fill="url(#emeraldBody)"/>

    <!-- Fold Crease Center -->
    <path d="M 5 40 L 75 15 L 30 42 Z" fill="#08342C"/>

    <!-- Upper Wing -->
    <path d="M 30 42 L 75 15 L 60 52 Z" fill="#10B981"/>
  </g>

  <!-- Just 2 Calm, Subtle Accent Dots (No heavy sparks or confetti) -->
  <circle cx="215" cy="45" r="3.5" fill="#10B981" />
  <circle cx="45" cy="60" r="2.5" fill="#A7F3D0" />
  <circle cx="205" cy="115" r="2.5" fill="#CBD5E1" />
</svg>
