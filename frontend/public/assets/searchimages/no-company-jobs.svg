<svg width="280" height="190" viewBox="0 0 280 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Watercolor Wash Backdrop -->
    <radialGradient id="companyPencilWash" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EBF8F4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Building Tint -->
    <linearGradient id="compEmeraldInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="compPrimaryInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>
  </defs>

  <!-- Ambient Soft Watercolor Wash Backdrop -->
  <ellipse cx="140" cy="100" rx="122" ry="74" fill="url(#companyPencilWash)" />

  <!-- Grounding Pencil Scribble Shadow -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M 44 162 C 90 160.5, 190 160.5, 236 162" />
    <path d="M 64 165 C 104 164.2, 178 164.2, 216 165" />
    <path d="M 88 168 C 122 167.2, 162 167.2, 196 168" />
    <!-- Fine 45-degree ground hatch marks -->
    <path d="M 94 160 L 100 165 M 108 160 L 114 165 M 122 160 L 128 165 M 136 160 L 142 165 M 150 160 L 156 165 M 164 160 L 170 165 M 178 160 L 184 165" stroke-width="0.85" opacity="0.45" />
  </g>

  <!-- Left Secondary Architecture / Building Sketch (Offset Background) -->
  <g transform="translate(64, 52)">
    <path d="M 4 4 L 46 4 L 45 106 L 4 106 Z" fill="#F1F5F9" opacity="0.6" />
    <path d="M 0 4.5 C 16 3.5, 34 3.8, 48 4 M 46 0 C 45 36, 45 74, 45 110 M 48 106 C 34 107, 16 106.5, 0 106 M 4 110 C 3.5 74, 4 36, 4 0" 
          stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <!-- Secondary Building Windows -->
    <g fill="#CBD5E1" opacity="0.6">
      <rect x="12" y="16" width="8" height="12" rx="1" />
      <rect x="28" y="16" width="8" height="12" rx="1" />
      <rect x="12" y="38" width="8" height="12" rx="1" />
      <rect x="28" y="38" width="8" height="12" rx="1" />
      <rect x="12" y="60" width="8" height="12" rx="1" />
      <rect x="28" y="60" width="8" height="12" rx="1" />
    </g>
  </g>

  <!-- Main Handdrawn Company HQ Building (Center) -->
  <g transform="translate(98, 32)">
    <!-- Base Building Wash -->
    <path d="M 4 4 C 28 3.5, 62 3.5, 86 4.5 C 87.5 38, 87 84, 85.5 126 C 60 127.2, 28 126.8, 4 126 C 2.5 84, 3 38, 4 4 Z" fill="#FFFFFF" />

    <!-- Primary Ink Contour with corner overshoots -->
    <path d="M 0 4.5 C 28 3.5, 64 3.5, 90 4.5 M 86 0 C 87.5 38, 87 84, 85.5 130 M 90 126 C 60 127.2, 26 126.8, 0 126 M 4 130 C 2.5 84, 3 38, 4 0" 
          stroke="#0C463B" stroke-width="1.7" stroke-linecap="round" />

    <!-- Secondary loose sketch pass (architectural double lines) -->
    <path d="M 2 3 C 28 4, 62 3.8, 88 3 M 87.5 2 C 86 38, 86.5 82, 87 127 M 88 127 C 62 125.8, 28 126.2, 2 127 M 2.5 127 C 3.5 82, 2.5 38, 2.5 2"
          stroke="#64748B" stroke-width="0.8" stroke-linecap="round" opacity="0.45" />

    <!-- Rooftop Antenna / Mast Motif -->
    <path d="M 45 4 L 45 -10" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="45" cy="-10" r="2.5" fill="#10B981" stroke="#0C463B" stroke-width="1" />
    <path d="M 39 -6 C 42 -8, 48 -8, 51 -6" stroke="#10B981" stroke-width="1" fill="none" opacity="0.7" />

    <!-- Building Entrance / Glass Door (Sketched) -->
    <g transform="translate(30, 96)">
      <path d="M 0 30 L 0 4 C 0 1, 30 1, 30 4 L 30 30" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />
      <path d="M 15 2 L 15 30" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="11" cy="18" r="1.2" fill="#10B981" />
      <circle cx="19" cy="18" r="1.2" fill="#10B981" />
    </g>

    <!-- Grid of Handdrawn Office Windows -->
    <g transform="translate(14, 18)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="14" height="12" rx="2" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 0 6 L 14 6 M 7 0 L 7 12" stroke="#A7F3D0" stroke-width="0.9" />

      <rect x="24" y="0" width="14" height="12" rx="2" fill="#D1FAE5" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 24 6 L 38 6 M 31 0 L 31 12" stroke="#10B981" stroke-width="0.9" />

      <rect x="48" y="0" width="14" height="12" rx="2" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 48 6 L 62 6 M 55 0 L 55 12" stroke="#A7F3D0" stroke-width="0.9" />

      <!-- Row 2 -->
      <rect x="0" y="20" width="14" height="12" rx="2" fill="#D1FAE5" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 0 26 L 14 26 M 7 20 L 7 32" stroke="#10B981" stroke-width="0.9" />

      <rect x="24" y="20" width="14" height="12" rx="2" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 24 26 L 38 26 M 31 20 L 31 32" stroke="#A7F3D0" stroke-width="0.9" />

      <rect x="48" y="20" width="14" height="12" rx="2" fill="#ECFDF5" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 48 26 L 62 26 M 55 20 L 55 32" stroke="#10B981" stroke-width="0.9" />

      <!-- Row 3 -->
      <rect x="0" y="40" width="14" height="12" rx="2" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 0 46 L 14 46 M 7 40 L 7 52" stroke="#A7F3D0" stroke-width="0.9" />

      <rect x="24" y="40" width="14" height="12" rx="2" fill="#D1FAE5" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 24 46 L 38 46 M 31 40 L 31 52" stroke="#10B981" stroke-width="0.9" />

      <rect x="48" y="40" width="14" height="12" rx="2" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.1" />
      <path d="M 48 46 L 62 46 M 55 40 L 55 52" stroke="#A7F3D0" stroke-width="0.9" />
    </g>

    <!-- Hatching Shadows on Base Corner -->
    <g stroke="#94A3B8" stroke-width="0.75" opacity="0.4">
      <path d="M 68 106 L 78 116 M 72 106 L 82 116 M 76 106 L 84 114" />
    </g>
  </g>

  <!-- Right Side Organic Tree Sketch (Foreground Accent) -->
  <g transform="translate(196, 92)">
    <!-- Tree Trunk -->
    <path d="M 12 40 C 13 50, 11 62, 10 68 M 16 40 C 15 50, 17 62, 18 68" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 8 68 C 14 67.5, 20 67.5, 24 68" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Tree Foliage Canopy (Handdrawn Organic Cloud Wash) -->
    <path d="M 14 8 C 8 8, 2 14, 2 20 C -2 26, 0 34, 6 38 C 10 42, 22 42, 28 38 C 34 34, 34 24, 30 18 C 28 10, 20 8, 14 8 Z" 
          fill="url(#compEmeraldInk)" fill-opacity="0.25" />
    <path d="M 14 8 C 8 8, 2 14, 2 20 C -2 26, 0 34, 6 38 C 10 42, 22 42, 28 38 C 34 34, 34 24, 30 18 C 28 10, 20 8, 14 8 Z" 
          stroke="#0C463B" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 12 12 C 16 10, 22 14, 24 18" stroke="#10B981" stroke-width="1" stroke-linecap="round" fill="none" />
  </g>

  <!-- Notification / Calendar Tag "Check Back Soon" Badge -->
  <g transform="translate(186, 46) rotate(6)">
    <rect x="0" y="0" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#0C463B" stroke-width="1.4" />
    <rect x="0" y="0" width="46" height="7" rx="3" fill="#0C463B" />
    <!-- Clock icon in badge -->
    <circle cx="11" cy="14" r="4" stroke="#10B981" stroke-width="1" fill="none" />
    <path d="M 11 12 L 11 14 L 13 14" stroke="#0C463B" stroke-width="0.9" stroke-linecap="round" />
    <!-- Text Line -->
    <path d="M 18 14 C 26 13.6, 36 13.8, 40 14" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Sparkles & Whimsical Sketched Accents -->
  <g transform="translate(54, 26)">
    <path d="M 0 -6 L 0 6 M -6 0 L 6 0" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="1.1" fill="#0C463B" />
  </g>
  <g transform="translate(236, 36)">
    <path d="M 0 -5 L 0 5 M -5 0 L 5 0" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <circle cx="48" cy="88" r="1.8" fill="#10B981" opacity="0.75" />
  <circle cx="238" cy="142" r="1.6" fill="#94A3B8" opacity="0.6" />
</svg>
