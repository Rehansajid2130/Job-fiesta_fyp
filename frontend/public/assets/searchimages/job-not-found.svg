<svg width="240" height="170" viewBox="0 0 240 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Watercolor Wash Backdrop -->
    <radialGradient id="notFoundPencilWash" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EBF8F4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Briefcase Emerald Tint -->
    <linearGradient id="casePencilTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <!-- Badge Mint Tint -->
    <linearGradient id="questBadgeTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Soft Watercolor Wash Backdrop -->
  <ellipse cx="120" cy="90" rx="104" ry="66" fill="url(#notFoundPencilWash)" />

  <!-- Handdrawn Grounding Pencil Scribble Shadow -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M 44 144 C 74 142.5, 148 142.8, 186 144" />
    <path d="M 58 147 C 88 146, 138 146.2, 172 147" />
    <path d="M 72 150 C 98 149.2, 130 149.2, 154 150" />
    <!-- Fine 45-degree angled pencil hatch marks on base -->
    <path d="M 82 142 L 87 146 M 94 142 L 99 146 M 106 142 L 111 146 M 118 142 L 123 146 M 130 142 L 135 146" stroke-width="0.85" opacity="0.45" />
  </g>

  <!-- Background Dashed Frame (Missing slot silhouette) -->
  <path d="M 50 32 C 84 30.5, 142 30.8, 178 32.5 C 179.5 58, 179 92, 177.5 124 C 142 125.5, 86 125, 49.5 123.5 C 48 92, 48.5 58, 50 32 Z" 
        fill="none" stroke="#CCFBF1" stroke-width="1.4" stroke-dasharray="4 6" stroke-linecap="round" />

  <!-- Main Handdrawn Briefcase (Job item) -->
  <g transform="translate(68, 50)">
    <!-- Briefcase Body Wash -->
    <path d="M 6 18 C 34 16.5, 78 16.8, 102 18.5 C 103.5 40, 103 66, 101.8 82 C 78 83.2, 32 82.8, 6 82 C 4.8 66, 5.2 40, 6 18 Z" 
          fill="#FFFFFF" />

    <!-- Briefcase Primary Pencil Contour with Corner Overshoots -->
    <path d="M 2 18.5 C 34 16.5, 80 16.8, 106 18.5 M 102 14 C 103.5 40, 103 66, 101.8 86 M 106 82 C 78 83.2, 30 82.8, 2 82 M 6 86 C 4.8 66, 5.2 40, 6 14" 
          fill="none" stroke="#0C463B" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Secondary sketchy pencil pass (authentic double line) -->
    <path d="M 4 16.5 C 36 17.5, 76 17, 103 18.2 M 103.5 16 C 102 42, 102.5 68, 101 83 M 103 83.5 C 76 82, 32 82.5, 4 81" 
          fill="none" stroke="#94A3B8" stroke-width="0.8" stroke-linecap="round" opacity="0.6" stroke-dasharray="45 3" />

    <!-- Top Handle with Inked Loops -->
    <path d="M 38 18 V 8 C 38 4, 44 2, 54 2 C 64 2, 70 4, 70 8 V 18" 
          fill="none" stroke="#0C463B" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 40 17 V 9 C 40 5.5, 45 4, 54 4 C 63 4, 68 5.5, 68 9 V 17" 
          fill="none" stroke="#10B981" stroke-width="0.9" stroke-linecap="round" />

    <!-- Briefcase Center Clasp & Straps -->
    <path d="M 26 18 V 82" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 82 18 V 82" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />

    <!-- Center Lock Clasp -->
    <rect x="49" y="38" width="10" height="12" rx="2" fill="#EBF8F4" stroke="#0C463B" stroke-width="1.3" />
    <circle cx="54" cy="44" r="1.5" fill="#0C463B" />

    <!-- Horizontal Seam Line -->
    <path d="M 6 42 C 34 41.5, 76 41.8, 102 42" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />

    <!-- Fine Pencil Cross-Hatch Shading on Briefcase Flank -->
    <g stroke="#0C463B" stroke-width="0.75" stroke-linecap="round" opacity="0.28">
      <line x1="90" y1="28" x2="97" y2="24" />
      <line x1="91" y1="36" x2="98" y2="32" />
      <line x1="91" y1="56" x2="98" y2="52" />
      <line x1="92" y1="64" x2="99" y2="60" />
      <line x1="92" y1="72" x2="99" y2="68" />
    </g>
  </g>

  <!-- Handdrawn Question Mark / Search Compass Badge (Floating at Top Right) -->
  <g transform="translate(138, 22)">
    <!-- Badge shadow backing -->
    <circle cx="16" cy="16" r="15" fill="#FFFFFF" />

    <!-- Sketched circular badge contour (double loop) -->
    <path d="M 16 2 C 24 2, 30.5 8.5, 30.5 16.5 C 30.5 24.5, 24 31, 16 31 C 8 31, 1.5 24.5, 1.5 16.5 C 1.5 8.5, 8 2, 16 2 Z" 
          fill="url(#questBadgeTint)" stroke="#0C463B" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 15 3.5 C 22.5 3, 29 9, 29 16.5 C 29 24, 23 29.5, 15.5 29.8 C 8 29.5, 3 24, 3 16.5 C 3 9, 8.5 3.5, 15 3.5" 
          fill="none" stroke="#10B981" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="28 2" />

    <!-- Handdrawn Question Mark -->
    <path d="M 11.5 11 C 12 7.5, 15 6.5, 17 6.5 C 20 6.5, 21.5 8.5, 21 11 C 20.5 13.5, 17.5 14.5, 17 17" 
          fill="none" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="17" cy="21.5" r="1.6" fill="#0C463B" />
  </g>
</svg>
