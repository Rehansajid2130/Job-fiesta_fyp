<svg width="280" height="190" viewBox="0 0 280 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Watercolor Wash Backdrop -->
    <radialGradient id="postPencilWash" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#EBF8F4" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EBF8F4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Ink Gradients -->
    <linearGradient id="postEmeraldInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="postPrimaryInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#08342C"/>
    </linearGradient>

    <linearGradient id="postPlusBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C463B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Ambient Soft Watercolor Wash Backdrop -->
  <ellipse cx="140" cy="98" rx="122" ry="74" fill="url(#postPencilWash)" />

  <!-- Grounding Pencil Scribble Shadow -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M 50 162 C 95 160.5, 185 160.5, 230 162" />
    <path d="M 68 165 C 105 164.2, 175 164.2, 212 165" />
    <path d="M 90 168 C 120 167.2, 160 167.2, 190 168" />
    <!-- Fine 45-degree ground hatch marks -->
    <path d="M 94 160 L 100 165 M 108 160 L 114 165 M 122 160 L 128 165 M 136 160 L 142 165 M 150 160 L 156 165 M 164 160 L 170 165 M 178 160 L 184 165" stroke-width="0.85" opacity="0.45" />
  </g>

  <!-- Background Easel / Bulletin Board Frame (Light Sketch) -->
  <g transform="translate(56, 32)">
    <!-- Backboard Wash -->
    <path d="M 8 10 C 50 8.5, 120 9, 160 10.5 C 161.5 45, 161 85, 159.5 124 C 120 125.2, 50 124.8, 8 123.5 C 6.5 85, 7 45, 8 10 Z" 
          fill="#F1F5F9" opacity="0.7" />
    <!-- Backboard Outer Contour with Corner Overshoots -->
    <path d="M 4 10.5 C 50 8.5, 122 9, 164 10.5 M 160 6 C 161.5 45, 161 85, 159.5 128 M 164 124 C 120 125.2, 48 124.8, 4 123.5 M 8 128 C 6.5 85, 7 45, 8 6" 
          stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Angled Left Document - Secondary Job Sheet Draft -->
  <g transform="translate(68, 42) rotate(-7)">
    <path d="M 2 2 C 26 1.5, 60 2, 76 2.5 C 77 28, 76.5 65, 75.5 96 C 54 97, 22 96.5, 2 95.8 C 1 65, 1.5 28, 2 2 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 0 2.5 C 26 1.5, 62 2, 78 2.5 M 76 0 C 77 28, 76.5 65, 75.5 98 M 78 96 C 54 97, 20 96.5, 0 95.8 M 2 98 C 1 65, 1.5 28, 2 0"
          stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 12 24 C 28 23.5, 52 23.8, 64 24" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 12 36 C 24 35.5, 46 35.8, 58 36" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Main Handdrawn Job Posting Document (Center Foreground) -->
  <g transform="translate(86, 34)">
    <!-- Base Paper Wash -->
    <path d="M 4 4 C 36 3, 90 3.5, 114 4.5 C 115.5 35, 115 80, 113.8 116 C 84 117.2, 34 116.8, 4 116 C 2.5 80, 3 35, 4 4 Z" fill="#FFFFFF" />

    <!-- Primary Ink Contour with corner overshoots -->
    <path d="M 0 4.5 C 36 3, 92 3.5, 118 4.5 M 114 0 C 115.5 35, 115 80, 113.8 120 M 118 116 C 84 117.2, 30 116.8, 0 116 M 4 120 C 2.5 80, 3 35, 4 0" 
          stroke="#0C463B" stroke-width="1.6" stroke-linecap="round" />

    <!-- Secondary loose sketch pass (authentic pencil double-line) -->
    <path d="M 2 3 C 38 4.2, 88 3.8, 116 3 M 115.5 2 C 114 36, 114.5 78, 115 117 M 116 117 C 86 115.8, 34 116.2, 2 117 M 2.5 117 C 3.5 78, 2.5 36, 2.5 2"
          stroke="#64748B" stroke-width="0.8" stroke-linecap="round" opacity="0.45" />

    <!-- Top Pin / Tack at center top -->
    <g transform="translate(58, 2)">
      <ellipse cx="0" cy="0" rx="5.5" ry="5.5" fill="#10B981" />
      <ellipse cx="0" cy="0" rx="5.5" ry="5.5" stroke="#0C463B" stroke-width="1.2" />
      <!-- Pin highlight -->
      <circle cx="-1.5" cy="-1.5" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Header Job Banner Wash -->
    <path d="M 4 14 L 114 14.5 L 113.8 38 L 4 37.5 Z" fill="#EBF8F4" />
    <path d="M 2 38 C 36 37.5, 84 37.8, 116 38" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" />

    <!-- Briefcase Symbol on Job Header (Sketched) -->
    <g transform="translate(14, 20)">
      <!-- Handle -->
      <path d="M 4 2 C 4 -1, 10 -1, 10 2" stroke="#0C463B" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <!-- Body -->
      <rect x="0" y="2" width="14" height="10" rx="2" fill="#10B981" fill-opacity="0.85" stroke="#0C463B" stroke-width="1.1" />
      <!-- Lock latch -->
      <circle cx="7" cy="6" r="1" fill="#FFFFFF" />
    </g>

    <!-- Job Title Lines (Handdrawn Bold Ink) -->
    <g transform="translate(36, 21)">
      <path d="M 0 3 C 18 2.6, 46 2.8, 64 3" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 2 3.5 C 16 3.2, 44 3.4, 60 3.5" stroke="#10B981" stroke-width="0.9" stroke-linecap="round" opacity="0.6" />
      <path d="M 0 10 C 12 9.6, 30 9.8, 42 10" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" />
    </g>

    <!-- Role Requirements / Description Scribble Lines -->
    <g transform="translate(14, 48)">
      <!-- Bullet 1 with sketched check -->
      <path d="M 0 4 L 3 7 L 8 1" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 14 4 C 36 3.5, 68 3.8, 88 4" stroke="#475569" stroke-width="1.4" stroke-linecap="round" />

      <!-- Bullet 2 with sketched check -->
      <path d="M 0 16 L 3 19 L 8 13" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 14 16 C 32 15.5, 62 15.8, 82 16" stroke="#475569" stroke-width="1.4" stroke-linecap="round" />

      <!-- Bullet 3 with sketched check -->
      <path d="M 0 28 L 3 31 L 8 25" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 14 28 C 28 27.5, 54 27.8, 72 28" stroke="#475569" stroke-width="1.4" stroke-linecap="round" />

      <!-- Salary & Tag Badges at bottom -->
      <rect x="0" y="42" width="34" height="9" rx="4" fill="#EBF8F4" stroke="#0C463B" stroke-width="0.9" />
      <path d="M 6 46.5 C 14 46.2, 22 46.2, 28 46.5" stroke="#0C463B" stroke-width="1.4" stroke-linecap="round" />

      <rect x="38" y="42" width="30" height="9" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="0.9" />
      <path d="M 44 46.5 C 50 46.2, 58 46.2, 62 46.5" stroke="#059669" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- Corner Hatching Marks on Sheet -->
    <g stroke="#94A3B8" stroke-width="0.75" opacity="0.4">
      <path d="M 94 96 L 106 108 M 98 96 L 108 106 M 102 96 L 110 104" />
    </g>
  </g>

  <!-- Foreground "+ Create / Post" Button Stamp Badge (Bottom Right) -->
  <g transform="translate(182, 98)">
    <!-- Stamp Drop Shadow Wash -->
    <ellipse cx="26" cy="26" rx="26" ry="26" fill="#EBF8F4" opacity="0.8" />

    <!-- Outer Stamp Circle Contour -->
    <circle cx="26" cy="26" r="24" fill="url(#postPlusBadge)" />
    <circle cx="26" cy="26" r="24" stroke="#0C463B" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Secondary Dashed Sketch Perimeter -->
    <circle cx="26" cy="26" r="21" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="3 2" />

    <!-- Bold Plus Sign (Call-to-Action Motif) -->
    <path d="M 26 14 L 26 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 14 26 L 38 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Secondary Offset Plus Contour in Teal -->
    <path d="M 27 15 L 27 37 M 15 27 L 37 27" stroke="#D1FAE5" stroke-width="1" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Handdrawn Sparkling Elements & Flying Pencil Accents -->
  <!-- Sparkle Top Left -->
  <g transform="translate(54, 24)">
    <path d="M 0 -6 L 0 6 M -6 0 L 6 0" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="1.2" fill="#0C463B" />
  </g>

  <!-- Sparkle Right Side -->
  <g transform="translate(232, 54)">
    <path d="M 0 -5 L 0 5 M -5 0 L 5 0" stroke="#0C463B" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Whimsical floating ink dots -->
  <circle cx="48" cy="80" r="1.8" fill="#10B981" opacity="0.7" />
  <circle cx="236" cy="144" r="1.6" fill="#94A3B8" opacity="0.6" />
  <circle cx="56" cy="138" r="1.4" fill="#0C463B" opacity="0.5" />
</svg>
